version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: simpleapp-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: simpleapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  # Backend API Service
  backend:
    build: ./backend
    container_name: simpleapp-api
    depends_on:
      - db
    environment:
      PORT: 5000
      DATABASE_URL: postgres://user:password@db:5432/simpleapp
      JWT_SECRET: dev_secret_key_change_in_prod
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ALERT_EMAIL: ${ALERT_EMAIL}
      ENABLE_CHECK_ENDPOINT: "true"
      FRONTEND_URL: http://localhost:80
    ports:
      - "5000:5000"
    restart: always

  # Worker Service (Reuses Backend Image)
  worker:
    build: ./backend
    container_name: simpleapp-worker
    command: npm run worker
    depends_on:
      - db
      - backend
    environment:
      DATABASE_URL: postgres://user:password@db:5432/simpleapp
      RESEND_API_KEY: ${RESEND_API_KEY}
      ALERT_EMAIL: ${ALERT_EMAIL}
    restart: always

  # Frontend Service
  frontend:
    build: ./frontend
    container_name: simpleapp-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: always

volumes:
  postgres_data:
